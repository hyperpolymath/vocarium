# SPDX-License-Identifier: MPL-2.0
# stapeln.toml — Layer-based container build for vocarium
#
# stapeln builds containers as composable layers (German: "to stack").
# Each layer is independently cacheable, verifiable, and signable.

[metadata]
name = "vocarium"
version = "0.1.0"
description = "vocarium container image (voc; no server mode yet)"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"
registry = "ghcr.io/hyperpolymath"

[build]
containerfile = "Containerfile"
context = "."
runtime = "podman"

# ── Layer Definitions ──────────────────────────────────────────
#
# NOTE on what this image is: `vocarium` builds `voc` (build.zig,
# addExecutable name = "voc"), a CLI over the store (`voc ingest`,
# `voc invoke`). There is no HTTP server mode and no /health endpoint
# yet; starting this image runs `voc` with no arguments and the process
# exits. The compose stack (container/compose.yaml) is inert for the
# same reason until the app contract is completed.

[layers.base]
description = "Chainguard Wolfi minimal base"
from = "cgr.dev/chainguard/wolfi-base:latest"
cache = true
verify = true

[layers.toolchain]
description = "Build tools"
extends = "base"
packages = ["zig"]
cache = true

[layers.build]
description = "vocarium build (voc)"
extends = "toolchain"
commands = [
    "zig build --prefix /app -Doptimize=ReleaseSafe",
]

[layers.runtime]
description = "Minimal runtime"
from = "cgr.dev/chainguard/wolfi-base:latest"
packages = ["ca-certificates", "curl"]
copy-from = [
    { layer = "build", src = "/app/bin/voc", dst = "/app/voc" },
]
entrypoint = ["/app/voc"]
user = "nonroot"

# ── Security ───────────────────────────────────────────────────

[security]
non-root = true
read-only-root = false
no-new-privileges = true
cap-drop = ["ALL"]
seccomp-profile = "default"

[security.signing]
algorithm = "ML-DSA-87"
provider = "cerro-torre"

[security.sbom]
format = "spdx-json"
output = "sbom.spdx.json"
include-deps = true

# ── Verification ───────────────────────────────────────────────

[verify]
vordr = true
svalinn = true
scan-on-build = true
fail-on = ["critical", "high"]

# ── Targets ────────────────────────────────────────────────────

[targets.development]
layers = ["base", "toolchain", "build"]
env = { LOG_LEVEL = "debug" }

[targets.production]
layers = ["runtime"]
env = { LOG_LEVEL = "info" }

[targets.test]
layers = ["base", "toolchain", "build"]
env = { LOG_LEVEL = "debug" }
