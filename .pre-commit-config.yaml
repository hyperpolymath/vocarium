# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for hyperpolymath RSR repos.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

# pre-commit.ci has no sibling standards checkout; the dogfood CI job checks
# deeds using a pinned canonical checkout. Local pre-commit still runs the gate.
ci:
  autofix_prs: false
  skip: [validate-deed]

repos:
  # --- Standard hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # License texts are third-party/owner-controlled; never auto-format them.
      - id: trailing-whitespace
        exclude: '^(LICENSE|LICENSES/.*)$'
      - id: end-of-file-fixer
        exclude: '^(LICENSE|LICENSES/.*)$'
      - id: check-yaml
      - id: check-json
        # .devcontainer/devcontainer.json is JSONC by design (the Dev Container
        # config spec allows // comments) and ships in the estate with them
        # (e.g. rsr-template-repo, trope-checker); it can never parse as JSON.
        exclude: '^\.devcontainer/devcontainer\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # --- Shell linting ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        exclude: '(^LICENSE$|^LICENSES/|\.git/|node_modules/|target/|_build/|deps/|\.deno/|external_corpora/|\.lake/)'

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Local deed and arrival pack checks ---
  - repo: local
    hooks:
      - id: validate-k9-local
        name: Validate K9 contracts
        entry: bash .githooks/validate-k9.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-deed
        name: Validate deeds
        entry: bash .github/hooks/validate-deed.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-claude-md
        name: CLAUDE.md arrival pack in sync with deed
        entry: bash .machine_readable/arrival-pack/verify.sh
        language: system
        pass_filenames: false
        files: '^(vocarium_chora\.deed|\.machine_readable/descriptiles/STATE\.deed|\.machine_readable/arrival-pack/.*|scripts/deed-field\.sh|CLAUDE\.md)$'
