# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for hyperpolymath RSR repos.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- Standard hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # --- A2ML manifest validation ---
  # The provider repo (hyperpolymath/a2ml-pre-commit) was DELETED upstream in
  # the A2ML retirement (standards #836 owner ruling; R-H3), so this pin was
  # broken plumbing — pre-commit could not clone it. Replaced with a local
  # hook running the same validator CI's dogfood-gate lane uses
  # (.github/workflows/dogfood-gate.yml), .githooks/validate-a2ml.sh. It scans
  # every tracked .a2ml file. (The deed migration that retires .a2ml here is
  # issue #43 / draft PR #61 — out of scope for this CI repair.)
  - repo: local
    hooks:
      - id: validate-a2ml
        name: Validate A2ML manifests
        entry: bash .githooks/validate-a2ml.sh
        language: system
        pass_filenames: false
        files: '\.a2ml$'

  # --- K9 contract validation ---
  # The provider repo (hyperpolymath/k9-pre-commit) was DELETED upstream in the
  # same retirement (standards #836; R-H3). Replaced with a local hook running
  # the canonical in-repo validator CI's dogfood-gate lane uses,
  # .githooks/validate-k9.sh.
  - repo: local
    hooks:
      - id: validate-k9
        name: Validate K9 contracts
        entry: bash .githooks/validate-k9.sh
        language: system
        pass_filenames: false
        files: '\.k9(\.ncl)?$'

  # --- Shell linting ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.1
    hooks:
      - id: editorconfig-checker
        exclude: '(\.git|node_modules|target|_build|deps|\.deno|external_corpora|\.lake)/'

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # --- Arrival pack drift: CLAUDE.md must stay in sync with a2ml ---
  - repo: local
    hooks:
      - id: validate-claude-md
        name: CLAUDE.md arrival pack in sync with a2ml
        entry: bash .machine_readable/arrival-pack/verify.sh
        language: system
        pass_filenames: false
        files: '^(\.machine_readable/descriptiles/.*|CLAUDE\.md)$'
