# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
  # Preparation only: a real merge-group canary is required before rollout.
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Preserve the required GitHub Actions context `scan / gitleaks`.
  # The original hyperpolymath/standards URL now redirects, which GitHub Actions
  # does not support for reusable workflows. This is the same repository and
  # immutable commit under its current name, not a different scanner version.
  scan:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@84355587cb2a1f86e6882de83514a32db2646e7a
  scanner-contract:
    name: Secret scanner contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test required context and event wiring
        run: bash tests/workflows/secret_scanner_test.sh
