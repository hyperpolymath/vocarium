# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
  # Preparation only: a real merge-group canary is required before rollout.
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  # Preserve the required GitHub Actions context `scan / gitleaks`.
  # The old owner redirects, which Actions does not support for reusables.
  # The old commit's own lock rejects checkout at job setup; this newer pin has
  # a valid checkout lock and retains gating scans, including full git history.
  scan:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@8d1a2aab4211493cf42f147f2080f024605797dc
  scanner-contract:
    name: Secret scanner contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test required context and event wiring
        run: bash tests/workflows/secret_scanner_test.sh
