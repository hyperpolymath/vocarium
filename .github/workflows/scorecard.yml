# This workflow is managed by gh actions-lock.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@857ff096af11451841fb10488fed1438523973a1
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
